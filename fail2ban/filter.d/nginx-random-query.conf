# Фильтр fail2ban для запросов, которые nginx уже отклонил кодом 444
# (см. nginx/block-random-query.conf). Формат лога — стандартный combined.
# fail2ban вырезает дату из строки, поэтому на её месте остаются пустые скобки "[]".

[Definition]
failregex = ^<HOST> \- \S+ \[\] "GET /\?[a-z]{16} HTTP/[^"]+" 444
ignoreregex =
