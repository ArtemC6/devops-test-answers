# Блокировка запросов вида "GET /?[a-z]{16} HTTP/1.1"
# (корень сайта + строка запроса ровно из 16 строчных латинских букв, без "=" и "&").
#
# 1. Блок map кладётся в контекст http {} — например, этим файлом в /etc/nginx/conf.d/.
#    Сравниваем метод и исходный URI вместе со строкой запроса ($request_uri),
#    а не $request: так правило работает и для HTTP/2, где протокол будет "HTTP/2.0".

map "$request_method $request_uri" $block_random_query {
    default                    0;
    "~^GET /\?[a-z]{16}$"      1;
}

# 2. В каждый нужный server {} добавить проверку (return внутри if — безопасное использование if):
#
#    server {
#        ...
#        if ($block_random_query) {
#            return 444;   # закрыть соединение без ответа, не тратить трафик
#        }
#        ...
#    }
#
# 3. Проверка и применение:
#    nginx -t && systemctl reload nginx
#    curl -sS -o /dev/null -w '%{http_code}\n' 'http://example.local/?abcdefghijklmnop'  # пустой ответ (444), curl сообщит "Empty reply from server"
#    curl -sS -o /dev/null -w '%{http_code}\n' 'http://example.local/?abcdefghijklmno'   # 15 букв — обычный ответ
#    curl -sS -o /dev/null -w '%{http_code}\n' 'http://example.local/?utm_source=abc'    # обычный ответ
